version: "3.9"

services:

  gateway:
    build: ./gateway
    container_name: haman_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    depends_on:
      - conversation-service
      - rag-service
    volumes:
      - ./gateway:/app
    networks:
      - haman_network

  conversation-service:
    build: ./conversation-service
    container_name: haman_conversation
    env_file:
      - .env.dev
    depends_on:
      - postgres
    volumes:
      - ./conversation-service:/app
    networks:
      - haman_network

  rag-service:
    build: ./rag-service
    container_name: haman_rag
    env_file:
      - .env.dev
    depends_on:
      - qdrant
    volumes:
      - ./rag-service:/app
    networks:
      - haman_network

  lead-service:
    build: ./lead-service
    container_name: haman_lead
    env_file:
      - .env.dev
    depends_on:
      - postgres
    volumes:
      - ./lead-service:/app
    networks:
      - haman_network

  postgres:
    image: postgres:15
    container_name: haman_postgres
    environment:
      POSTGRES_USER: haman
      POSTGRES_PASSWORD: hamanpass
      POSTGRES_DB: haman_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - haman_network

  qdrant:
    image: qdrant/qdrant
    container_name: haman_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - haman_network

volumes:
  postgres_data:
  qdrant_data:

networks:
  haman_network:
    driver: bridge
