version: '3.9'

# Every service got this after the disk filled up on unrotated container logs
# (docker's default json-file driver keeps them forever otherwise). 10m x 3
# files per container is enough to read back a recent incident without
# needing days of history — anything older belongs in a real log store, not
# sitting on the container's own disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Note: nginx and laravel run in separate containers with no shared filesystem
  # (laravel bakes its code into the image at build time, no bind mount) — the
  # old `volumes_from: [laravel]` did nothing useful since laravel declared no
  # volumes of its own. That was invisible while this app was a pure JSON API,
  # but Filament's admin panel serves real static css/js, so nginx now needs a
  # volume it actually shares with laravel: laravel_public_assets, below.
  nginx:
    image: nginx:1.25-alpine
    container_name: haman_nginx
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - laravel_public_assets:/shared-assets:ro
    depends_on: [laravel]
    networks: [haman_net]
    restart: unless-stopped
    logging: *default-logging

  laravel:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: haman_laravel
    env_file: ./laravel-backend/.env
    volumes:
      - laravel_public_assets:/shared-assets
      # Database dumps. Without this they live inside the container and are
      # destroyed the next time it is recreated — which is every deploy.
      - laravel_backups:/var/www/html/storage/app/backups
      # A host bind mount, not a named volume: deploy/logrotate/haman-laravel
      # rotates this from the HOST, and logrotate cannot see inside a
      # container's own writable layer. laravel, horizon and scheduler all
      # write to the one storage/logs/laravel.log path (LOG_CHANNEL=stack ->
      # single), so all three share this same host directory rather than
      # each getting its own -- Monolog's appends are short enough to stay
      # atomic, and that is how multiple workers already shared one log file
      # before this was ever split into separate containers. Not tracked in
      # git (deploy's rsync has no --delete, so an untracked directory here
      # survives every redeploy untouched); see DEPLOY.md for the one-time
      # host setup this depends on.
      - ./logs:/var/www/html/storage/logs
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [haman_net]
    restart: unless-stopped
    logging: *default-logging

  horizon:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: haman_horizon
    command: php artisan horizon
    env_file: ./laravel-backend/.env
    volumes:
      - ./logs:/var/www/html/storage/logs
    depends_on: [laravel, redis]
    networks: [haman_net]
    restart: unless-stopped
    logging: *default-logging

  scheduler:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: haman_scheduler
    command: sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    env_file: ./laravel-backend/.env
    volumes:
      # The nightly backup actually runs here, so the scheduler needs the
      # same volume — and haman:verify-backup, run from either container,
      # has to find the file the other one wrote.
      - laravel_backups:/var/www/html/storage/app/backups
      - ./logs:/var/www/html/storage/logs
    depends_on: [laravel]
    networks: [haman_net]
    restart: unless-stopped
    logging: *default-logging

  python_ai:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: haman_python_ai
    env_file: ./python-ai-service/.env
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [haman_net]
    restart: unless-stopped
    logging: *default-logging

  postgres:
    # The official pgvector image, pinned by digest, instead of building the
    # extension from source.
    #
    # The build had stopped working: it installed clang19 and llvm19-dev from
    # Alpine, and those packages no longer exist in the repository, so the
    # image could not be rebuilt at all. The running container survived only
    # because its image was already on the host -- one `docker system prune`
    # away from a database that could not be started.
    #
    # The Dockerfile had also drifted from what was actually deployed. It said
    # Alpine with pgvector 0.7.4; the running image was Debian with 0.8.3. The
    # data directory was initialised by the Debian build, so Alpine would have
    # meant musl collations over a glibc-ordered volume. This image is the
    # same Debian lineage, Postgres 16 (a patch-level move, no pg_upgrade) and
    # pgvector 0.8.6, which reads the installed 0.8.3 extension unchanged.
    #
    # To move to a newer one: pull the tag, read its digest with
    #   docker inspect pgvector/pgvector:pg16 --format '{{index .RepoDigests 0}}'
    # and replace the line below. Never unpin it -- an unpinned tag means the
    # database silently changes version on some unrelated deploy.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: haman_postgres
    environment:
      POSTGRES_DB: haman_saas
      # hamman_user, with two m's, is not a typo and must not be "corrected".
      # The role predates the Haman rename and was deliberately left alone:
      # no customer and no API ever sees a role name, so renaming it buys
      # nothing and risks the one credential every service depends on. What
      # WAS a typo is what stood here before -- haman_user, one m -- which
      # matches no role that exists. It is ignored on an existing volume, so
      # nothing broke, but a fresh install would have created a role none of
      # the .env files name, and nothing would have been able to connect.
      POSTGRES_USER: hamman_user
      # ${VAR:?message} makes compose refuse to start when the variable is
      # missing or empty, rather than quietly bringing the database up with
      # no password at all. An empty password is worse than a leaked one.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env and fill it in}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to loopback, not every interface. Nothing outside Docker needs
    # this: every service reaches the database as "postgres" on haman_net.
    # Published on 0.0.0.0 it was reachable from the public internet, which
    # is what turned a password in the repository into remote access to the
    # database. Admin access goes through an SSH tunnel instead.
    ports: ["127.0.0.1:5432:5432"]
    networks: [haman_net]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U haman_user -d haman_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.2-alpine
    container_name: haman_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - copy .env.example to .env and fill it in} --maxmemory 256mb --maxmemory-policy allkeys-lru
    # The healthcheck below runs inside the container and needs the password
    # too. Passed as an environment variable so it is not repeated as a
    # literal in two places, which is how the old one stayed wrong after the
    # rename.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - copy .env.example to .env and fill it in}
    volumes: [redis_data:/data]
    # Loopback only, for the same reason as the database above.
    ports: ["127.0.0.1:6379:6379"]
    networks: [haman_net]
    healthcheck:
      test: ["CMD-SHELL","redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

networks:
  haman_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  laravel_public_assets:
  laravel_backups:
