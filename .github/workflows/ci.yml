name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on unresolved merge conflict markers
        run: |
          if grep -rlE '^<<<<<<< ' --include='*.php' --include='*.py' .; then
            echo "::error::Unresolved merge conflict markers found in the files listed above."
            exit 1
          fi
          echo "No conflict markers found."

      - name: PHP lint (php -l on every file outside vendor)
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find laravel-backend -name '*.php' -not -path '*/vendor/*' -print0)
          exit $status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax check (compileall)
        run: python -m compileall -q python-ai-service

  python-tests:
    name: Python AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A test job that collects nothing and goes green is worse than no
      # job at all: it reports success for a suite that never ran. This
      # fails the build if collection collapses, whatever the cause --
      # a renamed directory, a broken import, a bad working-directory.
      - name: Check the suite is actually discovered
        run: |
          set -e
          collected=$(python -m pytest tests --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "Collected $collected tests."
          if [ "$collected" -lt 300 ]; then
            echo "::error::Expected at least 300 tests, collected $collected. The suite is not being found."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest tests -q

  laravel-tests:
    name: Laravel tests
    runs-on: ubuntu-latest
    # Run against the image that actually ships, rather than a composer
    # install of the repo. This repository deliberately does not track the
    # Laravel skeleton -- no artisan, no public/index.php, most of config/
    # absent -- because the Dockerfile builds it with `composer
    # create-project` (see .gitignore). A plain `composer install` here
    # therefore could never work: it resolved fine once pcntl was added, then
    # died in its own post-autoload-dump hook running `php artisan
    # package:discover` against an artisan that is not in the repo.
    #
    # Building the image instead means CI tests the same artifact deployed to
    # production, and nothing generated has to be committed to please it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: haman_test
          POSTGRES_PASSWORD: haman_test
          POSTGRES_DB: haman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the Laravel image
        run: docker build -t haman-laravel-ci ./laravel-backend

      - name: Run tests
        run: |
          docker run --rm --network host             -e APP_ENV=testing             -e APP_KEY=base64:aGFtbWFuLWNpLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=             -e APP_DEBUG=false             -e DB_CONNECTION=pgsql             -e DB_HOST=127.0.0.1             -e DB_PORT=5432             -e DB_DATABASE=haman_test             -e DB_USERNAME=haman_test             -e DB_PASSWORD=haman_test             -e CACHE_STORE=array             -e SESSION_DRIVER=array             -e QUEUE_CONNECTION=sync             -e TELESCOPE_ENABLED=false             -e AI_SERVICE_SECRET=test-secret             --entrypoint sh             haman-laravel-ci -c "vendor/bin/phpunit"
