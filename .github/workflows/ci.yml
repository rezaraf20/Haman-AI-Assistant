name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on unresolved merge conflict markers
        run: |
          if grep -rlE '^<<<<<<< ' --include='*.php' --include='*.py' .; then
            echo "::error::Unresolved merge conflict markers found in the files listed above."
            exit 1
          fi
          echo "No conflict markers found."

      - name: PHP lint (php -l on every file outside vendor)
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find laravel-backend -name '*.php' -not -path '*/vendor/*' -print0)
          exit $status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax check (compileall)
        run: python -m compileall -q python-ai-service

  python-tests:
    name: Python AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A test job that collects nothing and goes green is worse than no
      # job at all: it reports success for a suite that never ran. This
      # fails the build if collection collapses, whatever the cause --
      # a renamed directory, a broken import, a bad working-directory.
      - name: Check the suite is actually discovered
        run: |
          set -e
          collected=$(python -m pytest tests --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "Collected $collected tests."
          if [ "$collected" -lt 300 ]; then
            echo "::error::Expected at least 300 tests, collected $collected. The suite is not being found."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest tests -q

  laravel-tests:
    name: Laravel tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hamman_test
          POSTGRES_PASSWORD: hamman_test
          POSTGRES_DB: hamman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: laravel-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pcntl is required by laravel/horizon. Without it composer
          # cannot resolve at all, which is why this job had never once
          # got past its install step. The Dockerfile installs it too --
          # CI and the runtime image should agree on the extension set.
          extensions: pdo, pdo_pgsql, pgsql, bcmath, intl, mbstring, zip, opcache, pcntl
          coverage: none

      - name: Composer install
        run: |
          composer config -g policy.advisories.block false
          composer install --no-interaction --prefer-dist --no-progress

      - name: Minimal .env for testing
        run: |
          cat > .env <<'EOF'
          APP_ENV=testing
          APP_KEY=base64:aGFtbWFuLWNpLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=
          APP_DEBUG=false
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=hamman_test
          DB_USERNAME=hamman_test
          DB_PASSWORD=hamman_test
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          TELESCOPE_ENABLED=false
          AI_SERVICE_SECRET=test-secret
          EOF

        # phpunit.xml's own <php> env block is what tests actually run
        # under — this .env only exists so `composer install`'s
        # post-autoload-dump (`artisan package:discover`) has something
        # valid to boot the console kernel against.

      - name: Run tests
        run: vendor/bin/phpunit
