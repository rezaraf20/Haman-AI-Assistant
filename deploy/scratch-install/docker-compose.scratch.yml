# Overrides that let a second, throwaway copy of the stack run beside the
# real one on the same host.
#
# Two things in docker-compose.yml are absolute rather than per-project, so a
# different `-p` name is not enough on its own:
#
#   container_name  is a host-wide name. Without overriding it, bringing this
#                   copy up would collide with haman_laravel and friends, and
#                   docker would refuse -- or worse, attach to them.
#   ports           are host bindings. 8080, 5432 and 6379 are already taken
#                   by the live stack. Note the !override tag: compose MERGES
#                   list-valued keys across files, so without it the service
#                   ends up publishing both the original port and the new one,
#                   and startup fails with "port is already allocated" --
#                   which is exactly what happened the first time this ran.
#                   !override needs compose v2.24+; this host runs v2.27.
#
# Volumes and networks are already namespaced by the project name, so this
# copy gets its own empty postgres_data -- which is the whole point: a
# database that has never been migrated.
services:
  nginx:
    container_name: haman_scratch_nginx
    ports: !override ["127.0.0.1:58080:80"]

  laravel:
    container_name: haman_scratch_laravel

  horizon:
    container_name: haman_scratch_horizon

  scheduler:
    container_name: haman_scratch_scheduler

  python_ai:
    container_name: haman_scratch_python_ai

  postgres:
    container_name: haman_scratch_postgres
    ports: !override ["127.0.0.1:55432:5432"]

  redis:
    container_name: haman_scratch_redis
    ports: !override ["127.0.0.1:56379:6379"]
