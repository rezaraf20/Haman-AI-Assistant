# The hamanai.com domains, in front of the same application.
#
#   hamanai.com      landing and signup
#   app.hamanai.com  customer and admin panels
#   api.hamanai.com  API and widget
#
# All of them proxy to 127.0.0.1:8080, because the split is by URL path inside
# Laravel, not by server. The docker nginx behind that port is a catch-all
# (`server_name _`), so every host reaching it gets identical handling --
# including the exact-match location for /api/v1/chat/message that turns off
# fastcgi buffering. That is why streamed replies work on these domains
# without repeating any SSE setting here: the setting was never in the Apache
# layer to begin with.
#
#
# WHY THESE ARE BOUND TO THE IP AND NOT TO *
#
# This box runs DirectAdmin, which generates a vhost per domain bound to
# 128.140.54.86:443 rather than to *:443. Apache prefers the vhost whose
# address matches the connection most specifically, so an explicit IP beats a
# wildcard no matter what order the files load in. A `<VirtualHost *:443>`
# block here would parse cleanly, appear in `apachectl -S`, and never serve a
# single request -- which is exactly what happened to hamman-proxy.conf: it
# has been dead config since it was written, and api.arshanweb.ir is really
# served by DirectAdmin's own vhost plus a mod_rewrite [P] rule in the
# docroot's .htaccess. Verified by the access log: requests land in
# /var/log/httpd/domains/arshanweb.ir.api.log.
#
# So these bind to the IP too, which puts them in the same bucket as the
# DirectAdmin vhosts, where load order does decide. httpd-includes.conf is
# read at httpd.conf:163 and directadmin-vhosts.conf at :219, so these win for
# the names they claim. They claim only the hamanai.com names.
#
#
# WHY THE FIRST BLOCK IS A COPY OF SOMETHING ELSE
#
# The first vhost in an address bucket is the one Apache falls back to for a
# request whose Host matches nothing. Loading ahead of DirectAdmin means the
# first block below would inherit that job, and roughly seventeen unrelated
# customer sites share this server. The two blocks immediately following are
# therefore a faithful copy of the vhost that holds the role today
# (httpd-vhosts.conf:31 and :43) so that the fallback keeps serving exactly
# what it served before. Do not put a hamanai.com block above them.
#
#
# api.arshanweb.ir is deliberately absent from this file. It keeps the vhost
# and the .htaccess it already has, untouched, and is never redirected here --
# widgets already installed on customer sites post signed requests to it, and
# a redirect drops the body of a POST. The two API hostnames are equals, not
# old and new.
#
# TLS uses the wildcard certificate DirectAdmin holds for *.hamanai.com, so a
# further subdomain needs no new certificate.

# ---------------------------------------------------------------------------
# Unchanged fallback. Mirrors httpd-vhosts.conf; see the note above.
# ---------------------------------------------------------------------------
<VirtualHost 128.140.54.86:80>
    ServerAdmin webmaster@localhost
    UserDir disabled
    DocumentRoot /var/www/html
    ServerName localhost
    ScriptAlias /cgi-bin/ /var/www/cgi-bin/
    CustomLog /var/log/httpd/homedir.log homedir
    CustomLog /var/log/httpd/access_log combined
    ErrorLog /var/log/httpd/error_log
    SuexecUserGroup webapps webapps
</VirtualHost>

<VirtualHost 128.140.54.86:443>
    ServerAdmin webmaster@localhost
    UserDir disabled
    DocumentRoot /var/www/html
    ServerName localhost
    ScriptAlias /cgi-bin/ /var/www/cgi-bin/
    CustomLog /var/log/httpd/homedir.log homedir
    CustomLog /var/log/httpd/access_log combined
    ErrorLog /var/log/httpd/error_log

    SSLEngine on
    SSLCertificateFile /etc/httpd/conf/ssl.crt/server.crt.combined
    SSLCertificateKeyFile /etc/httpd/conf/ssl.key/server.key
    SuexecUserGroup webapps webapps
</VirtualHost>

# ---------------------------------------------------------------------------
# The certificate renewal path, kept off the proxy.
#
# Every block below proxies "/" wholesale, which would hand an ACME HTTP-01
# challenge to the application, where it is a 404 -- and the certificate would
# stop renewing three months later, with nothing failing in the meantime to
# say so. So the proxy has to let that one path through.
#
# What it must NOT do is serve that path from this domain's own docroot.
# httpd-alias.conf carries a server-wide
#
#     Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
#
# and DirectAdmin writes every challenge token into that one central
# directory, for every domain on the box. An Alias inside a vhost overrides
# the global one for that vhost, so pointing it at /home/hamanai/... sent
# Apache looking somewhere the token is never written -- which breaks renewal
# rather than fixing it. Only the ProxyPass exclusion belongs here; the global
# Alias does the mapping.
# ---------------------------------------------------------------------------

<VirtualHost 128.140.54.86:80>
    ServerName hamanai.com
    ServerAlias www.hamanai.com

    # Everything but the ACME challenge goes to https. mod_rewrite runs ahead
    # of mod_alias, so the condition -- not the Alias above -- is what keeps
    # the challenge answerable over plain http, which is the only way
    # HTTP-01 works.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost 128.140.54.86:443>
    ServerName hamanai.com
    ServerAlias www.hamanai.com

    SSLEngine on
    SSLCertificateFile /usr/local/directadmin/data/users/hamanai/domains/hamanai.com.cert.combined
    SSLCertificateKeyFile /usr/local/directadmin/data/users/hamanai/domains/hamanai.com.key

    ProxyPass /.well-known/acme-challenge !

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>

<VirtualHost 128.140.54.86:80>
    ServerName app.hamanai.com

    # Everything but the ACME challenge goes to https. mod_rewrite runs ahead
    # of mod_alias, so the condition -- not the Alias above -- is what keeps
    # the challenge answerable over plain http, which is the only way
    # HTTP-01 works.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost 128.140.54.86:443>
    ServerName app.hamanai.com

    SSLEngine on
    SSLCertificateFile /usr/local/directadmin/data/users/hamanai/domains/hamanai.com.cert.combined
    SSLCertificateKeyFile /usr/local/directadmin/data/users/hamanai/domains/hamanai.com.key

    ProxyPass /.well-known/acme-challenge !

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>

<VirtualHost 128.140.54.86:80>
    ServerName api.hamanai.com

    # Everything but the ACME challenge goes to https. mod_rewrite runs ahead
    # of mod_alias, so the condition -- not the Alias above -- is what keeps
    # the challenge answerable over plain http, which is the only way
    # HTTP-01 works.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost 128.140.54.86:443>
    ServerName api.hamanai.com

    SSLEngine on
    SSLCertificateFile /usr/local/directadmin/data/users/hamanai/domains/hamanai.com.cert.combined
    SSLCertificateKeyFile /usr/local/directadmin/data/users/hamanai/domains/hamanai.com.key

    ProxyPass /.well-known/acme-challenge !

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
