server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Re-resolve the backend on every request instead of once at startup.
    #
    # With a literal `fastcgi_pass laravel:9000`, nginx resolves that name
    # when it loads the config and caches the address for the life of the
    # worker. `docker compose up -d laravel` gives the container a NEW ip,
    # so nginx keeps dialling the dead one and every route returns 502 until
    # nginx itself is restarted. That took the site down for two minutes.
    #
    # Passing the target through a variable forces a runtime lookup, which
    # needs an explicit resolver: 127.0.0.11 is Docker's embedded DNS server,
    # always at that address inside a user-defined network. valid=10s caps how
    # long a resolved address is reused, so a recreated container is picked up
    # within ten seconds at worst.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $upstream_laravel laravel:9000;

    # CORS is handled entirely by Laravel's built-in HandleCors middleware
    # (api/* routes, permissive defaults). Do not add CORS headers here too —
    # nginx adding its own Access-Control-Allow-Origin on top of Laravel's
    # produces a duplicated header on every response, which browsers treat as
    # an invalid CORS response and reject outright (fetch() throws a network
    # error even though the HTTP request itself succeeded).

    # Filament's static assets, published by the laravel container at build/
    # start time into a volume nginx has no other access to (see docker-compose
    # laravel_public_assets). Everything else still falls through to PHP below.
    location /css/ {
        alias /shared-assets/css/;
    }
    location /js/ {
        alias /shared-assets/js/;
    }

    # The WordPress plugin offered by the setup guide, copied into the same
    # volume by the laravel entrypoint.
    location /downloads/ {
        alias /shared-assets/downloads/;
    }

    # The link-preview card, fetched by chat apps and search engines rather
    # than by browsers. Cached hard: it only changes when the artwork does.
    location /og/ {
        alias /shared-assets/og/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # The logo assets and self-hosted brand fonts.
    location /brand/ {
        alias /shared-assets/brand/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /fonts/ {
        alias /shared-assets/fonts/;
        expires 30d;
        add_header Cache-Control "public";
        # Browsers refuse a cross-origin font load without this even though
        # every domain here points at the same backend — CORS checks the
        # request's origin, not where it actually ends up, and app.hamanai.com
        # loading a font this vhost serves for api.arshanweb.ir counts as
        # cross-origin.
        add_header Access-Control-Allow-Origin "*";
    }

    # Browsers request /favicon.ico directly regardless of what a
    # <link rel="icon"> in the page says, so it has to exist at the root —
    # not just under /brand/, which is where every other logo asset lives.
    location = /favicon.ico {
        alias /shared-assets/favicon.ico;
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /apple-touch-icon.png {
        alias /shared-assets/apple-touch-icon.png;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exact-match location (highest nginx precedence, beats the regex .php$
    # block below) so SSE responses from ChatController::sendMessage() reach
    # the browser as they're generated instead of being buffered by nginx
    # until PHP-FPM finishes — fastcgi_buffering is "on" by default, which
    # would silently turn a real token-by-token stream back into one big
    # chunk delivered at the end, defeating the entire point.
    location = /api/v1/chat/message {
        fastcgi_pass $upstream_laravel;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 130;
        fastcgi_buffering off;
    }

    location ~ \.php$ {
        fastcgi_pass $upstream_laravel;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 130;
    }

    location ~ /\.(env|git) { deny all; }
}
